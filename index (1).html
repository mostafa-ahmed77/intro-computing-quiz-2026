<style>
/* Colorful redesign: gradient banner, per-lecture tab colors, playful cards. Markup and logic untouched. */
:root {
  --bg: #f4f1ff;
  --surface: #ffffff;
  --surface-2: #efeafd;
  --fg: #231a45;
  --muted: #6b6390;
  --line: #ddd5f5;
  --accent: #7a4dff;
  --accent-ink: #ffffff;
  --ok: #0f9d6b;
  --ok-bg: #dcf7ea;
  --bad: #e5484d;
  --bad-bg: #ffe5e6;
  --pick: #7a4dff;
  --g1: #7a4dff; --g2: #e04fb5; --g3: #ff8a4c;
  --shadow: 0 6px 20px rgba(98, 62, 200, .10);
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130f26; --surface: #1d1740; --surface-2: #2a2258; --fg: #f1ecff; --muted: #b3a9dd; --line: #3a3070;
    --accent: #a98bff; --accent-ink: #130f26; --ok: #4fe0a6; --ok-bg: #0f3a2c; --bad: #ff8087; --bad-bg: #44202a; --pick: #a98bff;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130f26; --surface: #1d1740; --surface-2: #2a2258; --fg: #f1ecff; --muted: #b3a9dd; --line: #3a3070;
  --accent: #a98bff; --accent-ink: #130f26; --ok: #4fe0a6; --ok-bg: #0f3a2c; --bad: #ff8087; --bad-bg: #44202a; --pick: #a98bff;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background:
    radial-gradient(600px 400px at 90% -5%, color-mix(in srgb, var(--g2) 22%, transparent), transparent 70%),
    radial-gradient(600px 400px at 0% 10%, color-mix(in srgb, var(--g1) 22%, transparent), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header {
  position: relative; overflow: hidden; border-radius: 22px; padding: 24px 22px;
  background: linear-gradient(135deg, var(--g1), var(--g2) 60%, var(--g3));
  color: #fff; box-shadow: 0 10px 28px rgba(122, 77, 255, .35);
}
header::before, header::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.16); }
header::before { width: 160px; height: 160px; top: -60px; right: -40px; }
header::after { width: 100px; height: 100px; bottom: -40px; left: 30%; background: rgba(255,255,255,.12); }
header > * { position: relative; z-index: 1; }
h1 { font-size: 1.7rem; line-height: 1.3; margin: 0; font-weight: 700; text-wrap: balance; }
h1::before { content: "🎓 "; }
.sub { margin: 6px 0 0; color: rgba(255,255,255,.92); font-size: 0.95rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.tab {
  --tc: #7a4dff;
  flex: 1 1 140px; min-width: 0;
  background: var(--surface); border: 2px solid var(--line); border-bottom: 4px solid var(--tc); border-radius: 14px;
  padding: 10px 14px; text-align: start; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow);
}
.tab:nth-child(1) { --tc: #7a4dff; }
.tab:nth-child(2) { --tc: #e04fb5; }
.tab:nth-child(3) { --tc: #ff8a4c; }
.tab:nth-child(4) { --tc: #14b8a6; }
.tab:nth-child(5) { --tc: #3b82f6; }
.tab:nth-child(6) { --tc: #f5b400; }
.tab .t-name { font-weight: 600; }
.tab .t-meta { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab:hover { border-color: var(--tc); }
.tab[aria-selected="true"] { background: var(--tc); border-color: var(--tc); color: #fff; transform: translateY(-2px); }
.tab[aria-selected="true"] .t-meta { color: #fff; opacity: 0.9; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.score-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.score-big { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; background: linear-gradient(90deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.score-small { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b-ok { background: linear-gradient(90deg, #12b886, #4fe0a6); }
.bar .b-bad { background: linear-gradient(90deg, #ff6b6b, #ff9a8b); }
.note { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 0.9rem; color: var(--muted); margin: 0; }
.reset { align-self: flex-start; background: transparent; border: 1.5px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 0.9rem; color: var(--muted); }
.reset:hover { border-color: var(--accent); color: var(--accent); }
.reset[data-armed="1"] { border-color: var(--bad); color: var(--bad); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; }
.chip {
  height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  font-family: var(--f-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; gap: 2px;
}
.chip:hover { border-color: var(--accent); transform: translateY(-2px); }
.chip.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.chip.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.chip svg { width: 11px; height: 11px; }

.list { display: flex; flex-direction: column; gap: 18px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-inline-start: 6px solid var(--accent);
  border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 12px; box-shadow: var(--shadow);
}
.card:nth-child(4n+1) { border-inline-start-color: #7a4dff; }
.card:nth-child(4n+2) { border-inline-start-color: #e04fb5; }
.card:nth-child(4n+3) { border-inline-start-color: #ff8a4c; }
.card:nth-child(4n+4) { border-inline-start-color: #14b8a6; }
.q-head { display: flex; gap: 10px; align-items: flex-start; }
.q-num { font-family: var(--f-mono); font-weight: 600; font-size: 0.85rem; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); border-radius: 99px; padding: 2px 11px; flex: none; margin-top: 3px; }
.q-text { margin: 0; font-weight: 500; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; text-align: left; flex: 1; }
.q-note { margin: 0; font-size: 0.88rem; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }

.opts { display: flex; flex-direction: column; gap: 9px; }
.opt-wrap { display: flex; flex-direction: column; gap: 6px; }
.opt {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 50px;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-2); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt .let { font-family: var(--f-mono); font-weight: 600; font-size: 0.85rem; width: 28px; height: 28px; flex: none; border-radius: 99px; background: var(--surface-2); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.opt:hover:not(:disabled) .let { background: var(--accent); color: var(--accent-ink); }
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .ico { width: 22px; height: 22px; flex: none; display: none; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.ok .ico { display: block; color: var(--ok); }
.opt.ok .let { background: var(--ok); color: #fff; }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.opt.bad .ico { display: block; color: var(--bad); }
.opt.bad .let { background: var(--bad); color: #fff; }
.opt.picked { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pick) 45%, transparent); }
.opt .you { font-size: 0.72rem; font-weight: 600; color: #fff; background: var(--pick); border-radius: 99px; padding: 0 9px; flex: none; }
.why { margin: 0; padding: 9px 12px; font-size: 0.93rem; border-radius: 12px; border-inline-start: 4px solid var(--line); background: var(--surface-2); }
.why.ok { border-inline-start-color: var(--ok); background: var(--ok-bg); }
.why.bad { border-inline-start-color: var(--bad); background: var(--bad-bg); }
.why b { font-weight: 700; }
.verdict { margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.verdict svg { width: 20px; height: 20px; }
.credit { text-align: center; color: var(--muted); font-size: 0.9rem; padding-top: 20px; border-top: 1px dashed var(--line); margin-top: 8px; }
.credit::after { content: " 💜"; }
@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  header { padding: 20px 16px; }
  .card { padding: 14px 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .chip, .tab { transition: background-color .15s, border-color .15s, transform .15s, color .15s; }
}
</style>

const LECS = [

const ICON_BAD = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="غلط"><circle cx="12" cy="12" r="10.5" stroke-width="2"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>';
const MINI_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const MINI_BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const KEY = "intro-computing-quiz-v1";

let cur = "l1";
let answers = { l1: {}, l2: {}, l3: {}, l4: {} };
let resetArmed = false;
let resetTimer = null;

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && saved.answers) {
    for (const id of Object.keys(answers)) answers[id] = saved.answers[id] || {};
    if (saved.cur && answers[saved.cur]) cur = saved.cur;
  }
} catch (e) {}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ cur: cur, answers: answers })); } catch (e) {}
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function stats(id) {
  const lec = LECS.find(function (l) { return l.id === id; });
  let ok = 0, bad = 0;
  lec.data.forEach(function (q, i) {
    const a = answers[id][i];
    if (a === undefined) return;
    if (a === q[1]) ok++; else bad++;
  });
  return { total: lec.data.length, ok: ok, bad: bad, done: ok + bad };
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = LECS.map(function (l) {
    const s = stats(l.id);
    return '<button class="tab" role="tab" id="tab-' + l.id + '" data-tab="' + l.id + '" aria-selected="' + (l.id === cur) + '">' +
      '<span class="t-name">' + esc(l.name) + '</span>' +
      '<span class="t-meta">' + s.done + ' / ' + s.total + ' · صح ' + s.ok + '</span></button>';
  }).join("");
}

function renderPanel() {
  const lec = LECS.find(function (l) { return l.id === cur; });
  const s = stats(cur);
  const pct = s.done ? Math.round((s.ok / s.done) * 100) : 0;
  let html = '<div class="score-row"><span class="score-big">صح ' + s.ok + ' من ' + s.done + (s.done ? ' (' + pct + '%)' : '') + '</span>' +
    '<span class="score-small">باقي ' + (s.total - s.done) + ' سؤال من ' + s.total + '</span></div>' +
    '<div class="bar" role="img" aria-label="تقدمك"><i class="b-ok" style="width:' + (s.ok / s.total * 100) + '%"></i><i class="b-bad" style="width:' + (s.bad / s.total * 100) + '%"></i></div>';
  if (lec.note) html += '<p class="note">' + esc(lec.note) + '</p>';
  html += '<div class="grid">' + lec.data.map(function (q, i) {
    const a = answers[cur][i];
    const cls = a === undefined ? "" : (a === q[1] ? "ok" : "bad");
    const mark = a === undefined ? "" : (a === q[1] ? MINI_OK : MINI_BAD);
    return '<button class="chip ' + cls + '" data-jump="' + i + '" aria-label="سؤال ' + (i + 1) + '">' + (i + 1) + mark + '</button>';
  }).join("") + '</div>';
  html += '<button class="reset" id="reset" data-armed="' + (resetArmed ? 1 : 0) + '">' + (resetArmed ? "اضغط تاني للتأكيد، هيتمسح حل المحاضرة دي" : "ابدأ المحاضرة من الأول") + '</button>';
  document.getElementById("panel").innerHTML = html;
}

function renderList() {
  const lec = LECS.find(function (l) { return l.id === cur; });
  document.getElementById("list").innerHTML = lec.data.map(function (q, i) {
    const a = answers[cur][i];
    const answered = a !== undefined;
    const right = q[1];
    let h = '<article class="card" id="q' + i + '"><div class="q-head"><span class="q-num">' + (i + 1) + '</span><p class="q-text" dir="ltr">' + esc(q[0]) + '</p></div>';
    if (q[3]) h += '<p class="q-note">' + esc(q[3]) + '</p>';
    h += '<div class="opts">';
    q[2].forEach(function (o, j) {
      let cls = "opt";
      if (answered) {
        cls += j === right ? " ok" : (j === a ? " bad" : "");
        if (j === a) cls += " picked";
      }
      const isRight = j === right;
      h += '<div class="opt-wrap"><button class="' + cls + '" data-q="' + i + '" data-o="' + j + '" dir="ltr"' + (answered ? " disabled" : "") + '>' +
        '<span class="let">' + LET[j] + '</span><span class="txt">' + esc(o[0]) + '</span>' +
        (answered && j === a ? '<span class="you" dir="rtl">إجابتك</span>' : '') +
        (answered ? (isRight ? ICON_OK : ICON_BAD) : '') + '</button>';
      if (answered && o[1]) {
        h += '<p class="why ' + (isRight ? "ok" : "bad") + '"><b>' + (isRight ? "ليه ده صح: " : "ليه ده غلط: ") + '</b>' + esc(o[1]) + '</p>';
      }
      h += '</div>';
    });
    h += '</div>';
    if (answered) {
      const good = a === right;
      h += '<p class="verdict ' + (good ? "ok" : "bad") + '">' + (good ? MINI_OK : MINI_BAD) + (good ? "إجابتك صح" : "إجابتك غلط، الإجابة الصح هي " + LET[right]) + '</p>';
    }
    h += '</article>';
    return h;
  }).join("");
}

function renderAll() { renderTabs(); renderPanel(); renderList(); }

document.addEventListener("click", function (e) {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    cur = tab.getAttribute("data-tab"); resetArmed = false; persist(); renderAll();
    window.scrollTo(0, 0);
    return;
  }
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    const qi = Number(opt.getAttribute("data-q"));
    const oi = Number(opt.getAttribute("data-o"));
    if (answers[cur][qi] === undefined) {
      answers[cur][qi] = oi; persist();
      renderTabs(); renderPanel(); renderList();
      const el = document.getElementById("q" + qi);
      if (el) el.scrollIntoView({ block: "nearest" });
    }
    return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    const el = document.getElementById("q" + jump.getAttribute("data-jump"));
    if (el) { el.scrollIntoView({ block: "start" }); }
    return;
  }
  if (e.target.closest("#reset")) {
    if (!resetArmed) {
      resetArmed = true;
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () { resetArmed = false; renderPanel(); }, 4000);
      renderPanel();
    } else {
      answers[cur] = {}; resetArmed = false; clearTimeout(resetTimer); persist(); renderAll();
      window.scrollTo(0, 0);
    }
  }
});
renderAll();
